[package]
name = "cast-onion-email"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cast-onion-email"
path = "src/main.rs"

[dependencies]
lettre = { version = "0.11", features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
dotenvy = "0.15"
