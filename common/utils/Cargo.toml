[package]
name = "cast-onion-utils"
version = "0.1.0"
edition = "2021"

[lib]
name = "cast_onion_utils"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"