[package]
name = "cast-onion-logger"
version = "0.1.0"
edition = "2021"

[lib]
name = "logger"
path = "src/lib.rs"

[[bin]]
name = "cast-onion-logger"
path = "src/main.rs"

[dependencies]
mysql = "25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
cast-onion-utils = { path = "../utils" }