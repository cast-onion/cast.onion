[package]
name = "cast-onion-butt"
version = "0.1.0"
edition = "2021"
description = "butt (Broadcast Using This Tool) integration for cast.onion"

[[bin]]
name = "cast-onion-butt"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21" }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"