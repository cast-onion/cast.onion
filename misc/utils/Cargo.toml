[package]
name = "cast-onion-misc-utils"
version = "0.1.0"
edition = "2021"

[lib]
name = "misc_utils"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }