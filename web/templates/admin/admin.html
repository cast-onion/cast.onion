<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin — cast.onion</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0a; --bg2: #111; --border: #222;
            --text: #e0e0e0; --muted: #666; --accent: #c8ff00; --danger: #ff4444;
            --font: 'Courier New', monospace;
        }
        body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .box { width: 320px; }
        .wordmark { color: var(--accent); font-size: 16px; font-weight: bold; display: block; margin-bottom: 32px; }
        .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        label { font-size: 12px; color: var(--muted); }
        input { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-family: var(--font); font-size: 14px; padding: 10px 14px; outline: none; width: 100%; }
        input:focus { border-color: #444; }
        button { background: var(--accent); border: none; border-radius: 4px; color: #000; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: bold; padding: 10px 20px; width: 100%; margin-top: 8px; }
        button:hover { background: #a8d900; }
        .error { color: var(--danger); font-size: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <span class="wordmark">cast.onion / admin</span>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST" action="/admin/login">
            <div class="field">
                <label>username</label>
                <input type="text" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label>password</label>
                <input type="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit">sign in</button>
        </form>
    </div>
</body>
</html>
