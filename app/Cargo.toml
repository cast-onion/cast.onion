[package]
name = "cast-onion-app"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.34", features = ["default"] }
egui = "0.27"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21" }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
cpal = "0.15"
audiopus = { version = "0.3.0-rc.0" }
ogg = "0.8"
dirs-next = "2"

[profile.release]
opt-level = 3